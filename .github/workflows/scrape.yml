  #     - uses: browser-actions/setup-chrome@v1
  #     - name: Install dependencies
  #       run: pip install -r woolworth_scraping-main/requirements.txt
  #     - name: Run scraper
  #       run: python woolworth_scraping-main/coles_scraper.py --part 1 --headless

  # scrape-coles-2:
  #   name: Coles (part 2)
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 340
  #   env:
  #     DATABASE_URL: ${{ secrets.DATABASE_URL }}
  #   steps:
  #     - uses: actions/checkout@v4
