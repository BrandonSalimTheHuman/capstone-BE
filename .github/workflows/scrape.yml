  #     - name: Run scraper
  #       run: python woolworth_scraping-main/coles_scraper.py --part 2 --headless

  scrape-aldi:
    name: Aldi
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: browser-actions/setup-chrome@v1
      - name: Install dependencies
        run: pip install -r woolworth_scraping-main/requirements.txt
      - name: Run scraper
        run: python woolworth_scraping-main/aldi_scraper.py --headless

  scrape-iga-1:
    name: IGA (part 1)
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Install dependencies
        run: pip install -r woolworth_scraping-main/requirements.txt
      - name: Install Latest Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get --only-upgrade install google-chrome-stable
      - name: Run scraper
        run: python woolworth_scraping-main/iga_scraper.py --part 1 --headless

  scrape-iga-2:
    name: IGA (part 2)
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Install dependencies
        run: pip install -r woolworth_scraping-main/requirements.txt
      - name: Run scraper
        run: python woolworth_scraping-main/iga_scraper.py --part 2 --headless

  # Runs after every scraper job regardless of pass/fail.
  # Marks any store_product whose last_updated is older than 12 hours as unavailable.
  mark-unavailable:
    name: Mark stale products unavailable
    runs-on: ubuntu-latest
    needs:
      - scrape-woolworths-1
      - scrape-woolworths-2
      # - scrape-coles-1
      # - scrape-coles-2
      - scrape-aldi
      - scrape-iga-1
      - scrape-iga-2
    if: always()
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install psycopg2
        run: pip install psycopg2-binary python-dotenv
      - name: Mark unavailable
        run: python woolworth_scraping-main/mark_unavailable.py
