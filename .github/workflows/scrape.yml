name: Daily Product Scraper

on:
  schedule:
    - cron: '0 16 * * 3' # 8 PM UTC = ~6 AM AEDT
  workflow_dispatch: # allow manual runs from the Actions tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # opt into Node.js 24 for all actions
  PYTHONUNBUFFERED: '1'

# Shared install steps are repeated per job because each job runs on a fresh
# runner. All scraper jobs are independent and run in parallel.

jobs:
  scrape-woolworths-1:
    name: Woolworths (part 1)
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: browser-actions/setup-chrome@v1
      - name: Install dependencies
        run: pip install -r woolworth_scraping-main/requirements.txt
      - name: Run scraper
        run: python woolworth_scraping-main/woolworths_scraper.py --part 1 --headless

  scrape-woolworths-2:
    name: Woolworths (part 2)
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: browser-actions/setup-chrome@v1
      - name: Install dependencies
        run: pip install -r woolworth_scraping-main/requirements.txt
      - name: Run scraper
        run: python woolworth_scraping-main/woolworths_scraper.py --part 2 --headless

  # scrape-coles-1:
